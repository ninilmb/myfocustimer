
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Focus Timer</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-pastel: #e0f2fe; /* Azul cielo pastel */
            --card-pastel: #ffffff;
            --accent-yellow: #fef08a; /* Amarillo pastel suave */
            --accent-yellow-hover: #fde047;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-pastel);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .title-app {
            font-size: 2.5rem;
            font-weight: 800;
            color: #2563eb;
            margin-bottom: 25px;
            text-transform: lowercase;
            letter-spacing: -1px;
        }

        .timer-container {
            background: var(--card-pastel);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(148, 163, 184, 0.15);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 4px solid #bae6fd;
        }

        /* Área del círculo que se consume */
        .visual-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9; /* Contorno o fondo límite del área */
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            overflow: hidden;
        }

        /* ESTE ES EL CÍRCULO QUE SE CONSUME DE VERDAD ENCOGÍENDOSE */
        .shrinking-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #fef08a; /* Amarillo pastel que llena el espacio */
            border-radius: 50%;
            transform: scale(1); /* Empieza al 100% (tamaño completo) */
            transition: transform 1s linear; /* Reducción fluida cada segundo */
            z-index: 1;
        }

        /* Contenido de la planta por encima del círculo */
        .plant-content {
            position: relative;
            z-index: 2; /* Por encima del círculo que se encoge */
            width: 140px;
            height: 140px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 15px;
        }

        .plant-svg {
            width: 100px;
            height: 100px;
            transition: all 0.5s ease;
        }

        .status-badge {
            position: absolute;
            top: -25px;
            background: #ffffff;
            border: 2px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Pantalla del Cronómetro */
        .timer-display {
            font-size: 4rem;
            font-weight: 700;
            color: var(--text-dark);
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }

        /* Configuración de Tiempo */
        .setup-group {
            margin-bottom: 20px;
            background: #f0fdf4; /* Fondo verde pastel sutil */
            padding: 15px;
            border-radius: 16px;
            border: 1px solid #bbf7d0;
            transition: opacity 0.3s ease;
        }

        .setup-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .time-input-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .time-input {
            width: 80px;
            padding: 8px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            color: var(--text-dark);
        }

        /* Controles de Música */
        .music-panel {
            background: #eff6ff; /* Azul pastel muy suave */
            border: 1px solid #bfdbfe;
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .music-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1e40af;
        }

        .btn-music {
            background: #ffffff;
            border: 2px solid #bfdbfe;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #1e40af;
            transition: all 0.2s;
        }

        .btn-music.active {
            background: #bfdbfe;
        }

        /* Botones de Control */
        .controls-row {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--accent-yellow);
            color: var(--text-dark);
            border: 2px solid #fde047;
        }

        .btn-primary:hover {
            background-color: var(--accent-yellow-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: #f1f5f9;
            color: var(--text-muted);
            border: 2px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <!-- Música de fondo en bucle -->
    <audio id="relax-audio" loop>
        <source src="https://soundhelix.com" type="audio/mp3">
    </audio>

    <!-- Título Requerido -->
    <h1 class="title-app">myfocustimer</h1>

    <div class="timer-container">
        
        <!-- Módulo del Círculo Consumible (Fondo) y Planta (Frente) -->
        <div class="visual-container">
            <!-- Círculo de color que se irá haciendo pequeño físicamente -->
            <div class="shrinking-circle" id="consume-circle"></div>
            
            <div class="plant-content">
                <div class="status-badge" id="plant-status">Semilla</div>
                <div id="plant-graphic-container">
                    <!-- SVG de la planta inyectado por JS -->
                </div>
            </div>
        </div>

        <!-- Tiempo Restante -->
        <div class="timer-display" id="display-time">25:00</div>

        <!-- Configuración de Tiempo -->
        <div class="setup-group" id="setup-panel">
            <label>Elige tu tiempo de estudio personalizado</label>
            <div class="time-input-wrapper">
                <input type="number" id="input-minutes" class="time-input" value="25" min="1" max="180">
                <span>minutos</span>
            </div>
        </div>

        <!-- Música Relajante -->
        <div class="music-panel">
            <div class="music-info">
                <i data-lucide="music" size="16"></i>
                <span>Música ambiental</span>
            </div>
            <button class="btn-music" id="btn-toggle-music">
                <i data-lucide="volume-x" size="14"></i> Apagada
            </button>
        </div>

        <!-- Botones de Acción -->
        <div class="controls-row">
            <button class="btn btn-primary" id="btn-start">
                <i data-lucide="play" size="18"></i> Empezar
            </button>
            <button class="btn btn-secondary" id="btn-reset">
                <i data-lucide="rotate-ccw" size="18"></i> Reiniciar
            </button>
        </div>
    </div>

    <script>
        // Diseños Gráficos de las fases de la planta
        const plantStages = {
            seed: `<svg class="plant-svg" viewBox="0 0 100 100"><circle cx="50" cy="80" r="6" fill="#78350f"/><path d="M47 80 Q50 72 53 80" stroke="#84cc16" stroke-width="3" fill="none"/></svg>`,
            sprout: `<svg class="plant-svg" viewBox="0 0 100 100"><path d="M50 80 Q52 60 48 50" stroke="#15803d" stroke-width="4" fill="none"/><path d="M48 50 Q38 42 42 35 Q50 42 48 50" fill="#4ade80"/><path d="M48 52 Q58 46 58 38 Q50 46 48 52" fill="#4ade80"/></svg>`,
