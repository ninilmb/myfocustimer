<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Focus Timer</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-pastel: #e0f2fe; /* Azul cielo pastel */
            --card-pastel: #ffffff;
            --accent-yellow: #fef08a; /* Amarillo pastel suave */
            --accent-yellow-hover: #fde047;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-pastel);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .title-app {
            font-size: 2.5rem;
            font-weight: 800;
            color: #2563eb;
            margin-bottom: 25px;
            text-transform: lowercase;
            letter-spacing: -1px;
        }

        .timer-container {
            background: var(--card-pastel);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(148, 163, 184, 0.15);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 4px solid #bae6fd;
        }

        /* Zona de la Planta */
        .plant-stage-box {
            height: 160px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            margin-bottom: 20px;
            background: #f8fafc;
            border-radius: 16px;
            padding: 15px;
            border: 2px dashed #cbd5e1;
            position: relative;
        }

        .plant-svg {
            width: 120px;
            height: 120px;
            transition: all 0.5s ease;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--accent-yellow);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* Pantalla del Cronómetro */
        .timer-display {
            font-size: 4rem;
            font-weight: 700;
            color: var(--text-dark);
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }

        /* Configuración de Tiempo */
        .setup-group {
            margin-bottom: 20px;
            background: #fefce8; /* Fondo sutil amarillo */
            padding: 15px;
            border-radius: 16px;
            border: 1px solid #fef08a;
        }

        .setup-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .time-input-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .time-input {
            width: 80px;
            padding: 8px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            color: var(--text-dark);
        }

        .time-input:focus {
            border-color: #3b82f6;
        }

        /* Controles de Música */
        .music-panel {
            background: #f0fdf4; /* Verde pastel muy suave */
            border: 1px solid #bbf7d0;
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .music-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #166534;
        }

        .btn-music {
            background: #ffffff;
            border: 2px solid #bbf7d0;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #166534;
            transition: all 0.2s;
        }

        .btn-music.active {
            background: #bbf7d0;
        }

        /* Botones de Control */
        .controls-row {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--accent-yellow);
            color: var(--text-dark);
            border: 2px solid #fde047;
        }

        .btn-primary:hover {
            background-color: var(--accent-yellow-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: #f1f5f9;
            color: var(--text-muted);
            border: 2px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background-color: #e2e8f0;
            color: var(--text-dark);
        }
    </style>
</head>
<body>

    <!-- Elemento de Audio (Música de piano relajante en bucle) -->
    <audio id="relax-audio" loop>
        <source src="https://soundhelix.com" type="audio/mp3">
    </audio>

    <!-- Título Principal Requerido -->
    <h1 class="title-app">myfocustimer</h1>

    <div class="timer-container">
        <!-- Contenedor Visual de la Planta -->
        <div class="plant-stage-box">
            <div class="status-badge" id="plant-status">Semilla</div>
            <div id="plant-graphic-container">
                <!-- SVG Dinámico inyectado por JS -->
            </div>
        </div>

        <!-- Tiempo Restante -->
        <div class="timer-display" id="display-time">25:00</div>

        <!-- Selector de Tiempo Personalizado -->
        <div class="setup-group" id="setup-panel">
            <label>Elige tu tiempo de estudio personalizado</label>
            <div class="time-input-wrapper">
                <input type="number" id="input-minutes" class="time-input" value="25" min="1" max="180">
                <span>minutos</span>
            </div>
        </div>

        <!-- Panel de Música Relajante -->
        <div class="music-panel">
            <div class="music-info">
                <i data-lucide="music" size="16"></i>
                <span>Música ambiental</span>
            </div>
            <button class="btn-music" id="btn-toggle-music">
                <i data-lucide="volume-x" size="14" id="icon-music"></i>
                <span id="text-music">Apagada</span>
            </button>
        </div>

        <!-- Botones de Acción -->
        <div class="controls-row">
            <button class="btn btn-primary" id="btn-start">
                <i data-lucide="play" size="18"></i> <span id="text-start">Empezar</span>
            </button>
            <button class="btn btn-secondary" id="btn-reset">
                <i data-lucide="rotate-ccw" size="18"></i> Reiniciar
            </button>
        </div>
    </div>

    <script>
        // Diseños Gráficos de las fases de la planta
        const plantStages = {
            seed: `<svg class="plant-svg" viewBox="0 0 100 100"><circle cx="50" cy="80" r="6" fill="#78350f"/><path d="M47 80 Q50 72 53 80" stroke="#84cc16" stroke-width="3" fill="none"/></svg>`,
            sprout: `<svg class="plant-svg" viewBox="0 0 100 100"><path d="M50 80 Q52 60 48 50" stroke="#15803d" stroke-width="4" fill="none"/><path d="M48 50 Q38 42 42 35 Q50 42 48 50" fill="#4ade80"/><path d="M48 52 Q58 46 58 38 Q50 46 48 52" fill="#4ade80"/></svg>`,
            growing: `<svg class="plant-svg" viewBox="0 0 100 100"><path d="M50 80 Q55 50 45 30" stroke="#15803d" stroke-width="5" fill="none"/><path d="M45 30 Q30 20 38 10 Q48 20 45 30" fill="#22c55e"/><path d="M48 55 Q62 50 60 40 Q48 48 48 55" fill="#4ade80"/><path d="M47 40 Q32 38 35 28 Q45 34 47 40" fill="#4ade80"/></svg>`,
            mature: `<svg class="plant-svg" viewBox="0 0 100 100"><path d="M50 80 Q45 50 50 25" stroke="#15803d" stroke-width="6" fill="none"/><path d="M50 25 Q35 10 45 2 Q58 12 50 25" fill="#16a34a"/><path d="M48 45 Q28 40 32 28 Q46 35 48 45" fill="#22c55e"/><path d="M51 55 Q70 52 68 40 Q52 48 51 55" fill="#22c55e"/><circle cx="45" cy="10" r="7" fill="#fde047"/><circle cx="68" cy="40" r="5" fill="#fde047"/><circle cx="32" cy="28" r="5" fill="#fde047"/></svg>`
        };

        let countdown;
        let totalSeconds = 1500; 
        let secondsLeft = 1500;
        let isRunning = false;
        let isMusicPlaying = false;

        const displayTime = document.getElementById('display-time');
        const inputMinutes = document.getElementById('input-minutes');
        const btnStart = document.getElementById('btn-start');
        const btnReset = document.getElementById('btn-reset');
        const setupPanel = document.getElementById('setup-panel');
        const plantContainer = document.getElementById('plant-graphic-container');
        const plantStatus = document.getElementById('plant-status');
        
        // Elementos de música
        const audio = document.getElementById('relax-audio');
